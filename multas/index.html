<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Multas</title>
  <style>
    body {
      background-color: #608d6b;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding-top: 40px;
    }

    #caixa {
      display: flex;
      align-items: center;
      flex-direction: column;
      border-radius: 50;
    }

    h1 {
      color: #F8F0E3;
      margin-bottom: 20px;
    }

    footer {
      color: #F8F0E3;
      font-style: italic;
      margin-top: 20px;
    }

    main {
      background-color: #F8F0E3;
      border-radius: 10px;
      padding: 30px;
      width: 450px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
      text-align: center;

    }
  </style>
</head>

<body>
  <div id="caixa">
    <h1>Sistema de Multas</h1>
    <main>
      <p>Velocidade do carro:</p>
      <input type="text" id="velocidade" value="" /> km/h
      <input type="submit" onclick="verificar()" value="Verificar" />

      <p id="resultado"></p>
  </div>

  <script>
    function verificar() {
      var velocidade = document.getElementById("velocidade").value;

      var mensagem =
        "Sua velocidade atual é de <b>" + velocidade + "</b> km/h. <br>";

      if (velocidade >= 100) {
        mensagem += "Velocidade acima do permitido! <b>MULTADO.</b>";
      } else {
        mensagem += "Velocidade dentro do permitido.";
      }

      document.getElementById("resultado").innerHTML = mensagem;
    }
  </script>
  </main>

  <footer>
    <p>&copy; Emanuelly Maciel</p>
  </footer>
</body>

</html>
