<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabuada</title>
  <style>
    body {
      background-color: #608d6b;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding-top: 40px;
    }

    #caixa {
      display: flex;
      align-items: center;
      flex-direction: column;
      border-radius: 50;
    }

    h1 {
      color: #F8F0E3;
      margin-bottom: 20px;
    }

    footer {
      color: #F8F0E3;
      font-style: italic;
      margin-top: 20px;
    }

    main {
      background-color: #F8F0E3;
      border-radius: 10px;
      padding: 30px;
      width: 450px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
      text-align: center;

    }
  </style>
</head>

<body>
  <h1>Tabuada</h1>
  <main>
    <p>Digite um número:</p>
    <input type="number" id="numero" value="" />
    <input type="submit" onclick="gerarTabuada()" value="Gerar Tabuada" />

    <p id="resultado"></p>

    <script>
      function gerarTabuada() {
        var numero = document.getElementById("numero").value;
        var mensagem = "Tabuada do " + numero + ": <br>";

        for (var i = 1; i <= 10; i++) {
          var resultado = numero * i;
          mensagem += numero + " x " + i + " = " + resultado + "<br>";
        }

        document.getElementById("resultado").innerHTML = mensagem;
      }
    </script>
  </main>

  <footer>
    <p>&copy; Emanuelly Maciel</p>
  </footer>
</body>

</html>
