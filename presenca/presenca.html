<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirme sua Presença</title>
    <style>
        body {
            background-color: #608d6b;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-top: 40px;
        }

        #caixa {
            display: flex;
            align-items: center;
            flex-direction: column;
            border-radius: 50;
        }

        h1 {
            color: #F8F0E3;
            margin-bottom: 20px;
        }

        footer {
            color: #F8F0E3;
            font-style: italic;
            margin-top: 20px;
        }

        main {
            background-color: #F8F0E3;
            border-radius: 10px;
            padding: 30px;
            width: 450px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            text-align: center;

        }
    </style>
</head>

<body>

    <div id="caixa">
        <h1>Lista de Nomes:</h1>
        <main>
            <ul id="listaNomes">
                <li>
                    <input type="checkbox" id="nome1" /> João
                </li>
                <li>
                    <input type="checkbox" id="nome2" /> Márcio
                </li>
                <li>
                    <input type="checkbox" id="nome3" /> Fabiana
                </li>
                <li>
                    <input type="checkbox" id="nome4" /> Jorge
                </li>
                <li>
                    <input type="checkbox" id="nome5" /> Silvana
                </li>
                <li>
                    <input type="checkbox" id="nome6" /> Luiz
                </li>
                <li>
                    <input type="checkbox" id="nome7" /> Carlos
                </li>
                <li>
                    <input type="checkbox" id="nome8" /> Pablo
                </li>
            </ul>


            <input type="button" id="confirmarPresenca" onclick="confirmarPresenca()" value="Confirmar Presença" />

            <p id="resultado"></p>
    </div>


    <script>
        function confirmarPresenca() {
            var listaNomes = document.getElementById("listaNomes");
            var checkboxes = listaNomes.getElementsByTagName("input");
            var resultado = document.getElementById("resultado");
            var nomesConfirmados = [];
            var nomesAusentes = [];


            for (var i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i].checked) {
                    var nome = checkboxes[i].parentNode.textContent.trim();
                    nomesConfirmados.push(nome);
                }
            }

            for (var i = 0; i < checkboxes.length; i++) {
                if (!checkboxes[i].checked) {
                    var nome = checkboxes[i].parentNode.textContent.trim();
                    nomesAusentes.push(nome);
                }
            }

            if (nomesConfirmados.length > 0) {
                resultado.innerHTML =
                    'Presentes: <span style="color: green;">' + nomesConfirmados.join(", ") +
                    '</span><br>Ausentes: <span style="color: red;">' + nomesAusentes.join(", ") + '</span>';

            } else {
                resultado.innerHTML = "Nenhum nome selecionado.";
            }
        }
    </script>
    </main>

    <footer>
        <p>&copy; Emanuelly Maciel</p>
    </footer>
</body>

</html>
