<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conta Cliques</title>
  <style>
    body {
      background-color: #608d6b;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding-top: 40px;
    }

    #caixa {
      display: flex;
      align-items: center;
      flex-direction: column;
      border-radius: 50;
    }

    h1 {
      color: #F8F0E3;
      margin-bottom: 20px;
    }

    footer {
      color: #F8F0E3;
      font-style: italic;
      margin-top: 20px;
    }

    main {
      background-color: #F8F0E3;
      border-radius: 10px;
      padding: 30px;
      width: 450px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
      text-align: center;

    }
  </style>
</head>

<body>
  <div id="caixa">
    <h1>Contador de Cliques</h1>
    <main>
      <button onclick="contarClique()">Aperte aqui</button>
      <button onclick="zerarClique() ">Zerar Contador</button>

      <p>Cliques: <span id="contador">0</span></p>

      <p id="resultado"></p>
  </div>

  <script>
    let cliques = 0;

    function contarClique() {
      cliques++;
      document.getElementById('contador').textContent = cliques;
    }

    function zerarClique() {
      document.getElementById('contador').textContent = cliques = 0;
    }
  </script>
  </main>

  <footer>
    <p>&copy; Emanuelly Maciel</p>
  </footer>
</body>

</html>
