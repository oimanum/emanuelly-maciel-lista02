
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buscaCEP</title>
</head>
<body>

    <h2>buscaCEP</h2>

    <input id="cep" placeholder="Digite o CEP (ex: 01001000)">
    <button onclick="buscar()">Buscar Endereço</button>
    <div id="resultado"></div>

    <script>
        async function buscar() {
            const cep = document.getElementById("cep").value.replace(/\D/g, "");
            const r = document.getElementById("resultado");

            if (cep.length !== 8) return r.textContent = "CEP inválido.";

            try {
                const d = await fetch(`https://viacep.com.br/ws/${cep}/json/`).then(r => r.json());
                if (d.erro) throw new Error();

                r.innerHTML = `
                    <p>Logradouro: ${d.logradouro}</p>
                    <p>Bairro: ${d.bairro}</p>
                    <p>Cidade: ${d.localidade}</p>
                    <p>Estado: ${d.uf}</p>`;
            } catch {
                r.textContent = "Erro ao buscar endereço.";
            }
        }
    </script>

</body>
</html>
