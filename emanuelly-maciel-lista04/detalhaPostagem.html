
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>detalhaPostagem</title>
</head>
<body>

    <h2>detalhaPostagem</h2>

    <label>Usuário:</label>
    <select id="usuario"></select>

    <div id="postagens"></div>

    <script>
        const usuario = document.getElementById("usuario");
        const postagens = document.getElementById("postagens");

        async function carregarPostagens() {
            const dados = await fetch(`https://jsonplaceholder.typicode.com/posts?userId=${usuario.value}`).then(r => r.json());

            postagens.innerHTML = dados.map(p => `
                <div>
                    <button onclick="detalhar(${p.id})">${p.title}</button>
                    <div id="d${p.id}"></div>
                </div>
            `).join("");
        }

        async function detalhar(id) {
            const [p, c] = await Promise.all([
                fetch(`https://jsonplaceholder.typicode.com/posts/${id}`).then(r => r.json()),
                fetch(`https://jsonplaceholder.typicode.com/posts/${id}/comments`).then(r => r.json())
            ]);

            document.getElementById(`d${id}`).innerHTML = `
                <h3>${p.title}</h3>
                <p>${p.body}</p>
                <h4>Comentários:</h4>
                ${c.map(x => `<p><b>${x.name}</b>: ${x.body}</p>`).join("")}
            `;
        }

        fetch("https://jsonplaceholder.typicode.com/users")
            .then(r => r.json())
            .then(dados => {
                usuario.innerHTML = dados.map(u => `<option value="${u.id}">${u.name}</option>`).join("");
                carregarPostagens();
            });

        usuario.onchange = carregarPostagens;
    </script>

</body>
</html>
